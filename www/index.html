<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><script>
/* Local shim: replaces the claude.ai-only features when you run Landed on your own computer. */
(function(){
if(window.claude)return;
const KEY="landed-api-key",MODEL="claude-sonnet-5-5";
function askKey(){return new Promise(res=>{const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);font-family:system-ui,sans-serif";
d.innerHTML='<div style="background:#1c1c1e;color:#f5f5f7;border-radius:24px;padding:26px;width:min(420px,92vw)"><h3 style="margin:0 0 6px">Add your Anthropic API key</h3><p style="margin:0 0 14px;color:#98989d;font-size:14px">Needed for the AI assistant, study plans and reminders. It is stored only on this computer. Get one at console.anthropic.com.</p><input id="lk" type="password" placeholder="sk-ant-..." style="width:100%;padding:12px;border-radius:12px;border:1px solid #3a3a3c;background:#000;color:#fff;font-size:15px"><div style="display:flex;gap:8px;margin-top:14px"><button id="lc" style="flex:1;padding:12px;border-radius:12px;border:0;background:#2c2c2e;color:#fff;cursor:pointer">Not now</button><button id="ls" style="flex:1;padding:12px;border-radius:12px;border:0;background:#f5f5f7;color:#000;font-weight:600;cursor:pointer">Save</button></div></div>';
document.body.appendChild(d);const done=v=>{d.remove();res(v)};d.querySelector("#lc").onclick=()=>done(null);d.querySelector("#ls").onclick=()=>{const v=d.querySelector("#lk").value.trim();if(v)localStorage.setItem(KEY,v);done(v||null)}})}
const b64=f=>new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.onerror=j;x.readAsDataURL(f)});
async function call(input,opts){let k=localStorage.getItem(KEY);if(!k)k=await askKey();if(!k)throw new Error("no key");
let msgs=typeof input=="string"?[{role:"user",content:input}]:input.map(m=>({role:m.role,content:m.content}));
if(opts&&opts.images&&opts.images.length){const last=msgs[msgs.length-1],imgs=[];for(const f of opts.images)imgs.push({type:"image",source:{type:"base64",media_type:f.type||"image/png",data:await b64(f)}});last.content=[...imgs,{type:"text",text:String(last.content)}]}
const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:MODEL,max_tokens:2500,messages:msgs})});
if(r.status==401){localStorage.removeItem(KEY);throw new Error("bad key")}if(!r.ok)throw new Error("api "+r.status);
const j=await r.json();return j.content.filter(c=>c.type=="text").map(c=>c.text).join("")}
const parse=t=>{t=t.replace(/```json|```/g,"").trim();const a=t.indexOf("{"),b=t.lastIndexOf("}");return JSON.parse(t.slice(a,b+1))};
const sample={json:async(i,o)=>parse(await call(i,o)),text:async(i,o)=>call(i,o),limits:async()=>({images:true})};
const user={id:async()=>"local",me:async()=>({id:"local",name:"",email:""})};
const downloads={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data],{type:"text/plain"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}};
window.claude={use:async n=>({sample,user,downloads})[n]||null};
})();
</script>
